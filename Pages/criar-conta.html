<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta - PongoEdu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200" rel="stylesheet" />

  <link rel="stylesheet" href="../Styles/criar-conta.css">
</head>

<body>
  <header class="topbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="home.html" class="logo-area text-decoration-none">
        <img src="../Assets/Imagens/Pongo.svg" class="logo-img" alt="PongoEdu">
        <div>
          <div class="brand-title"><span>Pongo</span><span>Edu</span></div>
          <div class="brand-subtitle">Gestão de Laboratórios</div>
        </div>
      </a>

      <div class="nav-actions">
        <a href="home.html" class="home-link">
          <span class="material-symbols-rounded">home</span>
          Página inicial
        </a>

        <a href="entrar.html" class="login-link">
          <span class="material-symbols-rounded">login</span>
          Entrar
        </a>
      </div>
    </div>
  </header>

  <main class="create-page">
    <div class="circle circle-left"></div>
    <div class="circle circle-right"></div>
    <div class="circle circle-bottom-left"></div>

    <div class="dot dot-purple-1"></div>
    <div class="dot dot-purple-2"></div>
    <div class="dot dot-green-1"></div>
    <div class="dot dot-green-2"></div>
    <div class="dot dot-blue"></div>

    <section class="create-card">
      <img src="../Assets/Imagens/Pongo.svg" class="mascot" alt="Mascote PongoEdu">

      <h2 class="brand">
        <span class="green">Pongo</span><span class="purple">Edu</span>
      </h2>
      <h3>Crie sua conta</h3>
      <p class="subtitle">Preencha seus dados para começar.</p>

      <form>
        <div class="form-group">
          <label>Nome completo</label>
          <div class="input-wrapper">
            <span class="material-symbols-rounded">person</span>
            <input type="text" placeholder="Seu nome completo">
          </div>
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <div class="input-wrapper">
            <span class="material-symbols-rounded">mail</span>
            <input type="email" placeholder="seu@email.com">
          </div>
        </div>

        <div class="form-group">
          <label>Senha</label>
          <div class="input-wrapper">
            <span class="material-symbols-rounded">lock</span>
            <input type="password" placeholder="12345678" id="password">
            <button type="button" class="eye-btn" data-target="password">
              <span class="material-symbols-rounded">visibility</span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Confirmar senha</label>
          <div class="input-wrapper">
            <span class="material-symbols-rounded">lock</span>
            <input type="password" placeholder="12345678" id="confirmPassword">
            <button type="button" class="eye-btn" data-target="confirmPassword">
              <span class="material-symbols-rounded">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="create-btn">
          <span class="material-symbols-rounded">person_add</span>
          Criar conta
        </button>
      </form>

      <p class="login-text">
        Já tem uma conta?
        <a href="entrar.html">Entrar</a>
      </p>
    </section>
  </main>

  <footer class="footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <strong><span>Pongo</span>Edu</strong>
        <p>Gestão de Laboratórios</p>
      </div>

      <nav>
        <a href="#">Recursos</a>
        <a href="#">Planos</a>
        <a href="#">Demonstração</a>
        <a href="#">Blog</a>
        <a href="#">Suporte</a>
      </nav>

      <small>© 2026 PongoEdu. Todos os direitos reservados.</small>
    </div>
  </footer>

  <script>
    document.querySelectorAll(".eye-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        input.type = input.type === "password" ? "text" : "password";
      });
    });
  </script>
</body>
</html>
